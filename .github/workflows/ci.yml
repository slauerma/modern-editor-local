name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: macOS source checks
    # The current tests use POSIX executables, permissions, symlinks and FIFOs.
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare esbuild
        run: npm rebuild esbuild
      - name: Install the pinned Electron runtime and notices
        run: node node_modules/electron/install.js
      - name: Type check
        run: npm run typecheck
      - name: Run offline tests
        run: npm test
      - name: Build application
        run: npm run build
